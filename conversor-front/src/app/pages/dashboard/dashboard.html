<app-navbar/>
  <div class="main-container">
    <h1 class="title">CONVERSOR DE DIVISAS</h1>

    <div class="converter-card">
      <div class="amount-section">
        <label>IMPORTE</label>
        <input type="number" [(ngModel)]="conversion.cantidad" (input)="convertir()" class="input-huge">
      </div>

      <div class="selectors">
        <select [(ngModel)]="conversion.origen" (change)="convertir()">
          <option *ngFor="let d of divisasSoportadas" [value]="d">{{d}}</option>
        </select>
        <span class="swap-icon">⇄</span>
        <select [(ngModel)]="conversion.destino" (change)="convertir()">
          <option *ngFor="let d of divisasSoportadas"  [value]="d">{{d}}</option>
        </select>
      </div>

      <div class="result-display" *ngIf="resultado">
        <h2 class="res-val">{{ resultado | number:'1.2-2' }} {{ conversion.destino }}</h2>
        <p class="res-rate">1 {{ conversion.origen }} = {{ tasaCambio | number:'1.4-4' }} {{ conversion.destino }}</p>
      </div>

      <button class="btn-primary" (click)="convertir()">CONVERTIR</button>
    </div>

    <div class="market-summary">
      <h3 class="section-label">RESUMEN DE MERCADO (BASE EUR)</h3>
      
      <div class="market-item" *ngFor="let m of marketRates; let i = index" [style.background]="i%2==0 ? '#f8f9fa' : '#ffffff'">
        <div class="m-info">
          <span class="m-code"><strong>{{ m.codigo }}</strong></span>
          <span class="m-name">{{ m.codigo }}</span>
        </div>
        <div class="m-price">{{ m.valor | number:'1.2-4' }}</div>
        <div class="chart-wrapper">
          <canvas [id]="'chart-' + m.codigo"></canvas>
        </div>
      </div>
    </div>
  </div>
