<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-card">
    <h2>BIENVENIDO</h2>
    
    <div class="input-group">
      <input type="email" formControlName="email" placeholder="Email" class="input-f">
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="err">
        Email no válido
      </div>
    </div>

    <div class="input-group">
      <input type="password" formControlName="password" placeholder="Password" class="input-f">
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="err">
        Mínimo 4 caracteres
      </div>
    </div>
    
    <button type="submit" [disabled]="loginForm.invalid" class="btn-l">ENTRAR</button>
    <a routerLink="/register">¿No tienes cuenta? Regístrate</a>
  </form>
</div>
