<div class="login-container">

  <div class="login-card">

    <h1>Iniciar sesión</h1>

    <p class="subtitle">Accede a tu conversor de divisas</p>

    <input
      type="email"
      [(ngModel)]="user.email"
      placeholder="Email">

    <input
      type="password"
      [(ngModel)]="user.password"
      placeholder="Contraseña">

    <button (click)="login()">
      Entrar
    </button>

    <p class="link">
      ¿No tienes cuenta?
      <a routerLink="/registro">Regístrate</a>
    </p>

  </div>

</div>
