<div class="register-container">

  <div class="register-card">

    <h1>Crear cuenta</h1>

    <p class="subtitle">Regístrate para usar el conversor</p>

    <input
      type="email"
      [(ngModel)]="user.email"
      placeholder="Email">

    <input
      type="password"
      [(ngModel)]="user.password"
      placeholder="Contraseña">

    <button (click)="register()">
      Registrarse
    </button>

    <p class="link">
      ¿Ya tienes cuenta?
      <a routerLink="/">Iniciar sesión</a>
    </p>

  </div>

</div>
