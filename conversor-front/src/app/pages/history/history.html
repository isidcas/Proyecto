<app-navbar></app-navbar>

<div class="history-page">
  <div class="card-container">
    <h2 class="history-title">HISTORIAL DE CONVERSIONES</h2>
    
    <div class="table-wrapper">
      <table class="modern-table" *ngIf="historial.length > 0">
        <thead>
          <tr>
            <th>FECHA</th>
            <th>CANTIDAD</th>
            <th>CONVERSIÓN</th>
            <th>RESULTADO</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let h of historial">
            <td class="date-text">{{ h.fecha | date:'dd/MM/yyyy HH:mm' }}</td>
            <td class="amount-text">{{ h.cantidad | number:'1.2-2' }} {{ h.moneda_origen }}</td>
            <td class="symbol-text">➜</td>
            <td class="result-text">{{ h.resultado | number:'1.2-2' }} <span>{{ h.moneda_destino }}</span></td>
          </tr>
        </tbody>
      </table>

      <div *ngIf="historial.length === 0" class="no-data">
        <p>Aún no has realizado conversiones.</p>
      </div>
    </div>
  </div>
</div>
